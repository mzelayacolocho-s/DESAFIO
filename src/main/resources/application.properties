spring.application.name=eventos
server.port=8080

#  Base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/eventos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-muy-larga-de-minimo-32-caracteres}
# Access token: 1 hora. Refresh token: 7 dias.
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# OAuth2 con GitHub
# Crear una OAuth App en https://github.com/settings/developers
# Callback URL: http://localhost:8080/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:cambiar-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:cambiar-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user
# Frontend al que se redirige con el JWT despues del login con GitHub
app.frontend-url=${FRONTEND_URL:http://localhost:5500/index.html}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true